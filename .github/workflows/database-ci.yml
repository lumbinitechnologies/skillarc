name: Database CI and staging
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Database validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # pinned v1
        with:
          version: 2.117.0
      - name: Check immutable migration history
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/local/check-migrations.mjs
          node --test scripts/local/check-migrations.test.mjs scripts/ci/*.test.mjs
          node scripts/ci/check-history.mjs
      - name: Replay complete history and database tests without hosted credentials
        run: node scripts/ci/database.mjs

  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/ci/server-tests.mjs

  staging:
    name: Migrate staging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [database, server]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: skillarc-staging-migrations
      cancel-in-progress: false
    environment: skillarc-staging
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify reviewed main and configured application gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_POLICY_READ_TOKEN: ${{ secrets.GH_POLICY_READ_TOKEN }}
          DEPLOYMENT_ENVIRONMENT: staging
          STAGING_RELEASE_ENABLED: ${{ vars.STAGING_RELEASE_ENABLED }}
          VERCEL_MIGRATION_GATE_CONFIGURED: ${{ vars.VERCEL_MIGRATION_GATE_CONFIGURED }}
        run: |
          test "$STAGING_RELEASE_ENABLED" = true
          test "$VERCEL_MIGRATION_GATE_CONFIGURED" = true
          node scripts/ci/verify-release.mjs
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.117.0
      - name: Verify ledger, dry run, migrate and verify staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: node scripts/ci/migrate.mjs staging
