name: Approved prelaunch website release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed main merge SHA matching tested staging
        required: true
        type: string
      fallback_deployment_id:
        description: Rehearsed production website fallback that keeps onboarding closed
        required: false
        type: string
      prepare_fallback:
        description: Stage an unaliased fallback only, without migration or promotion
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: skillarc-production-release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.release_sha }}
  FALLBACK_ID: ${{ inputs.fallback_deployment_id }}
  PREPARE_FALLBACK: ${{ inputs.prepare_fallback }}
  PRELAUNCH_RELEASE_ENABLED: ${{ vars.PRELAUNCH_RELEASE_ENABLED }}

jobs:
  verify:
    name: Verify exact reviewed website revision
    if: github.ref == 'refs/heads/main' && vars.PRELAUNCH_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: skillarc-policy
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      staging_evidence: ${{ steps.verify.outputs.staging_evidence }}
      staging_sha: ${{ steps.verify.outputs.staging_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify protected branches, review and hosted staging run
        id: verify
        env:
          DEPLOYMENT_ENVIRONMENT: production
          GH_TOKEN: ${{ github.token }}
          GH_POLICY_READ_TOKEN: ${{ secrets.GH_POLICY_READ_TOKEN }}
        run: |
          git fetch origin main staging
          node -e 'if (require("./config/deployment-targets.json").activation.prelaunch !== true) process.exit(1)'
          node scripts/ci/verify-release.mjs

  quality:
    name: Full website and database validation
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.117.0
      - run: npm ci
      - run: |
          npm run lint
          npm run typecheck
          node scripts/ci/server-tests.mjs
          node scripts/ci/database.mjs --production-readiness

  candidate:
    name: Rehearse on staging and prepare the exact production deployment
    needs: [verify, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: skillarc-candidates
    outputs:
      candidate_id: ${{ steps.stage.outputs.candidate_id }}
      rehearsal_id: ${{ steps.stage.outputs.rehearsal_id }}
      approval_digest: ${{ steps.stage.outputs.approval_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: |
          npm ci
          npm install --global vercel@63.1.2
      - name: Test the staging rehearsal and stage the exact production candidate
        id: stage
        env:
          STAGING_EVIDENCE: ${{ needs.verify.outputs.staging_evidence }}
          STAGING_SHA: ${{ needs.verify.outputs.staging_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: node scripts/ci/prelaunch-release.mjs stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prelaunch-approval-record
          path: prelaunch-record.json
          if-no-files-found: error
      - name: Remove pulled environment files
        if: always()
        run: rm -rf .vercel

  release:
    name: Approve prelaunch ${{ needs.candidate.outputs.approval_digest }}
    if: inputs.prepare_fallback == false
    needs: [verify, quality, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: skillarc-production
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      CANDIDATE_ID: ${{ needs.candidate.outputs.candidate_id }}
      REHEARSAL_ID: ${{ needs.candidate.outputs.rehearsal_id }}
      EXPECTED_APPROVAL_DIGEST: ${{ needs.candidate.outputs.approval_digest }}
      STAGING_EVIDENCE: ${{ needs.verify.outputs.staging_evidence }}
      STAGING_SHA: ${{ needs.verify.outputs.staging_sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.117.0
      - name: Install exact delivery tooling
        run: npm install --global vercel@63.1.2
      - name: Recheck owner approval binding before any migration
        env:
          DEPLOYMENT_ENVIRONMENT: production
          GH_TOKEN: ${{ github.token }}
          GH_POLICY_READ_TOKEN: ${{ secrets.GH_POLICY_READ_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          git fetch origin main staging
          GITHUB_OUTPUT="$RUNNER_TEMP/prelaunch-staging-before-migration" node scripts/ci/verify-release.mjs
          test "$(sed -n 's/^staging_evidence=//p' "$RUNNER_TEMP/prelaunch-staging-before-migration")" = "$STAGING_EVIDENCE"
          test "$(sed -n 's/^staging_sha=//p' "$RUNNER_TEMP/prelaunch-staging-before-migration")" = "$STAGING_SHA"
          node scripts/ci/prelaunch-release.mjs verify
      - name: Apply reviewed migrations and verify zero production fixtures
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/ci/migrate.mjs prelaunch
          node scripts/ci/production-clean.mjs
      - name: Recheck and promote only the approved prelaunch deployment
        env:
          DEPLOYMENT_ENVIRONMENT: production
          GH_TOKEN: ${{ github.token }}
          GH_POLICY_READ_TOKEN: ${{ secrets.GH_POLICY_READ_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          git fetch origin main staging
          GITHUB_OUTPUT="$RUNNER_TEMP/prelaunch-staging-before-promotion" node scripts/ci/verify-release.mjs
          test "$(sed -n 's/^staging_evidence=//p' "$RUNNER_TEMP/prelaunch-staging-before-promotion")" = "$STAGING_EVIDENCE"
          test "$(sed -n 's/^staging_sha=//p' "$RUNNER_TEMP/prelaunch-staging-before-promotion")" = "$STAGING_SHA"
          node scripts/ci/prelaunch-release.mjs promote
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prelaunch-release-record
          path: prelaunch-record.json
          if-no-files-found: error
