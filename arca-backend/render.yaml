services:
  - type: web
    name: arca-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    releaseCommand: python -m database.migrate
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
  - type: worker
    name: arca-ingestion-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    releaseCommand: python -m database.migrate
    startCommand: python -m worker.main
