name: skillarc-local

services:
  redis:
    image: redis:7-alpine
    container_name: skillarc-local-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - skillarc_local_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skillarc_local_redis:
